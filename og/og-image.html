<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Archivo Og";
    src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: "Plex Og";
    src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    font-weight: 500;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    background: #101010;
    color: #fafafa;
    font-family: "Archivo Og", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px;
    position: relative;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    align-self: flex-start;
    border: 1px solid rgba(250, 250, 250, 0.16);
    border-radius: 999px;
    padding: 11px 22px;
    font-family: "Plex Og", monospace;
    font-size: 20px;
    color: #c9c9c9;
    margin-bottom: 44px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 6px rgba(52, 211, 153, 0.14);
  }

  h1 {
    font-size: 108px;
    line-height: 0.92;
    letter-spacing: -0.055em;
    font-weight: 700;
  }

  h1 .t1 { color: #8a8a8a; display: block; }

  .rule {
    margin-top: 52px;
    height: 1px;
    background: rgba(250, 250, 250, 0.16);
  }

  .ledger {
    margin-top: 24px;
    display: flex;
    gap: 34px;
    font-family: "Plex Og", monospace;
    font-size: 21px;
    color: #8f8f8f;
  }

  .ledger b { color: #fafafa; font-weight: 500; }

  .who {
    position: absolute;
    right: 80px;
    bottom: 60px;
    font-family: "Plex Og", monospace;
    font-size: 19px;
    color: #6f6f6f;
  }
</style>
</head>
<body>
  <p class="badge"><span class="dot"></span>Disponible desde ya · Zaragoza</p>
  <h1><span class="t1">Software que</span>se puede probar</h1>

  <div class="rule"></div>
  <div class="ledger">
    <span><b>3</b> proyectos</span>
    <span><b>175</b> tests</span>
    <span><b>1</b> demo en vivo</span>
    <span><b>Kotlin · Python · React</b></span>
  </div>

  <p class="who">unai sayago</p>
</body>
</html>
